<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.6" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#071B1A"/>
    </linearGradient>

    <radialGradient id="glow" cx="72%" cy="35%" r="55%">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22C55E" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circuitry -->
  <g fill="none" stroke="#22C55E" stroke-opacity="0.35" stroke-width="2" filter="url(#neon)">
    <path d="M80 120 H280 V220 H420"/>
    <path d="M420 220 H520 V140 H680"/>
    <path d="M860 120 H1040 V220 H1120"/>
    <path d="M960 260 V360 H1120"/>
    <path d="M80 420 H220 V520 H420"/>
    <path d="M560 520 H760 V430 H920"/>
  </g>
  <g fill="#22C55E" fill-opacity="0.65">
    <circle cx="80" cy="120" r="5"/>
    <circle cx="280" cy="120" r="5"/>
    <circle cx="280" cy="220" r="5"/>
    <circle cx="420" cy="220" r="5"/>
    <circle cx="520" cy="140" r="5"/>
    <circle cx="680" cy="140" r="5"/>
    <circle cx="860" cy="120" r="5"/>
    <circle cx="1040" cy="120" r="5"/>
    <circle cx="1040" cy="220" r="5"/>
    <circle cx="1120" cy="220" r="5"/>
    <circle cx="960" cy="260" r="5"/>
    <circle cx="960" cy="360" r="5"/>
    <circle cx="1120" cy="360" r="5"/>
    <circle cx="80" cy="420" r="5"/>
    <circle cx="220" cy="420" r="5"/>
    <circle cx="220" cy="520" r="5"/>
    <circle cx="420" cy="520" r="5"/>
    <circle cx="560" cy="520" r="5"/>
    <circle cx="760" cy="520" r="5"/>
    <circle cx="760" cy="430" r="5"/>
    <circle cx="920" cy="430" r="5"/>
  </g>

  <!-- Card -->
  <g filter="url(#softShadow)">
    <rect x="90" y="150" width="1020" height="330" rx="26" fill="#0B1224" fill-opacity="0.88" stroke="#22C55E" stroke-opacity="0.30"/>
    <rect x="110" y="170" width="980" height="290" rx="22" fill="#070A12" fill-opacity="0.55" stroke="#22C55E" stroke-opacity="0.16"/>
  </g>

  <!-- Text -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial" fill="#E5E7EB">
    <text x="160" y="250" font-size="44" font-weight="700">Eddie Barlow</text>
    <text x="160" y="295" font-size="22" fill="#C7D2FE" fill-opacity="0.85">Senior Cyber Security Engineer</text>

    <text x="160" y="355" font-size="20" fill="#D1D5DB" fill-opacity="0.9">
      <tspan fill="#22C55E" font-weight="700">&lt;code&gt;</tspan>
      <tspan dx="10">Zero Trust · RMF · Cloud Security · DevSecOps · Vulnerability Management</tspan>
      <tspan dx="10" fill="#22C55E" font-weight="700">&lt;/code&gt;</tspan>
    </text>

    <text x="160" y="415" font-size="18" fill="#9CA3AF">
      Portfolio · Projects · Blog · Contact
    </text>

    <!-- Accent mark -->
    <text x="935" y="250" font-size="18" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      B.L.O.X. ONLINE
    </text>
    <rect x="935" y="265" width="135" height="6" rx="3" fill="#22C55E" fill-opacity="0.8"/>
  </g>
</svg>
